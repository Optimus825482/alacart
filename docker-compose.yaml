# ==============================================================================
# Merit A La Carte - Coolify Docker Compose Konfigürasyonu
# Domain: http://alacarte.erkanerdem.online (ve HTTPS Let's Encrypt)
# Mimari: Ayrı Container'lar (Next.js 16 Web Uygulaması + PostgreSQL 16)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Veritabanı Servisi
  # ----------------------------------------------------------------------------
  alacarte-db:
    image: postgres:16-alpine
    container_name: alacarte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in Coolify}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in Coolify}
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set in Coolify}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
      TZ: Asia/Nicosia
    volumes:
      - alacarte_pgdata:/var/lib/postgresql/data
    networks:
      alacarte_network:
        aliases:
          - alacarte-db
          - alacarte-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER must be set in Coolify} -d ${DB_NAME:?DB_NAME must be set in Coolify}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command: >
      postgres
      -c max_connections=150
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB

  # ----------------------------------------------------------------------------
  # 2. Next.js 16 A La Carte Uygulaması
  # ----------------------------------------------------------------------------
  alacarte-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alacarte-web
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in Coolify with the alacarte-db host}
      SCHEDULER_SECRET: ${SCHEDULER_SECRET:-alacarte_demo_super_secret_scheduler_token_32chars}
      DB_HOST: alacarte-db
      NODE_ENV: production
      DEPLOYMENT_MODE: coolify-demo
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: 1
      TZ: Asia/Nicosia
      ALACARTE_COOKIE_SECURE: "true"
      SEED_ON_START: ${SEED_ON_START:-false}
      ALLOW_DESTRUCTIVE_SEED: ${ALLOW_DESTRUCTIVE_SEED:-false}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_PIN: ${SEED_ADMIN_PIN:-}
      SEED_MANAGER_PASSWORD: ${SEED_MANAGER_PASSWORD:-}
      SEED_MANAGER_PIN: ${SEED_MANAGER_PIN:-}
      SEED_WAITER_PASSWORD: ${SEED_WAITER_PASSWORD:-}
      SEED_WAITER_PIN: ${SEED_WAITER_PIN:-}
      SEED_SETUP_KEY: ${SEED_SETUP_KEY:-}
    volumes:
      - alacarte_backups:/var/lib/alacarte/backups
      - alacarte_uploads:/app/public/uploads
    depends_on:
      alacarte-db:
        condition: service_healthy
    networks:
      - alacarte_network
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"

      # HTTP & HTTPS Yönlendirme Kuralları
      - "traefik.http.routers.alacarte.rule=Host(`alacarte.erkanerdem.online`)"
      - "traefik.http.routers.alacarte.entrypoints=http,https"
      - "traefik.http.routers.alacarte.tls=true"
      - "traefik.http.routers.alacarte.tls.certresolver=letsencrypt"

      # Port Yönlendirmesi (Container Port 3000)
      - "traefik.http.services.alacarte.loadbalancer.server.port=3000"
      - "traefik.http.services.alacarte.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.alacarte.loadbalancer.healthcheck.interval=20s"
      - "traefik.http.services.alacarte.loadbalancer.healthcheck.timeout=10s"

      # HTTP -> HTTPS Otomatik Yönlendirme
      - "traefik.http.middlewares.alacarte-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.alacarte-http.rule=Host(`alacarte.erkanerdem.online`)"
      - "traefik.http.routers.alacarte-http.entrypoints=http"
      - "traefik.http.routers.alacarte-http.middlewares=alacarte-redirect"

  alacarte-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alacarte-scheduler
    restart: unless-stopped
    entrypoint: ["tsx"]
    command: ["scripts/scheduled-worker.ts"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in Coolify with the alacarte-db host}
      DB_HOST: alacarte-db
      NODE_ENV: production
      TZ: Asia/Nicosia
      SCHEDULER_SECRET: ${SCHEDULER_SECRET:-alacarte_demo_super_secret_scheduler_token_32chars}
      SCHEDULER_POLL_MS: 2000
    depends_on:
      alacarte-db:
        condition: service_healthy
    networks:
      - alacarte_network

# ==============================================================================
# Kalıcı Veri Alanları (Volumes) - Sabit İsimli (Coolify UUID Bağımsız)
# ==============================================================================
volumes:
  alacarte_pgdata:
    name: alacarte_pgdata
  alacarte_backups:
    name: alacarte_backups
  alacarte_uploads:
    name: alacarte_uploads

# ==============================================================================
# Ağlar (Networks)
# ==============================================================================
networks:
  alacarte_network:
    driver: bridge
  coolify:
    external: true
